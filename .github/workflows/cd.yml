# CD — roda no push para main (e manualmente via "Run workflow").
#
# Deploy na VM OCI (frontend + backend juntos, via deploy/oci/deploy.sh) só
# roda se os secrets abaixo estiverem configurados em
# Settings > Secrets and variables > Actions:
#   VPS_HOST           IP público da instância OCI
#   VPS_USER           usuário SSH (ex.: ubuntu)
#   VPS_SSH_KEY        chave privada SSH (formato PEM, sem senha)
#   VPS_PORT           porta SSH (opcional, padrão 22)
#   VPS_BACKEND_PATH   caminho absoluto do repositório clonado na VM
#     (ex.: /var/www/techweek2026 — criado por deploy/oci/setup.sh)
#
# Enquanto VPS_HOST não estiver definido, o job de deploy na VM é pulado
# (skipped), não falha o workflow. Ver deploy/oci/ para o setup inicial da VM.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-vm:
    name: Deploy na VM OCI (frontend + backend)
    runs-on: ubuntu-latest
    if: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: Deploy via SSH (deploy/oci/deploy.sh)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            bash "${{ secrets.VPS_BACKEND_PATH }}/deploy/oci/deploy.sh"
