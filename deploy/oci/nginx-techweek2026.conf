# Site nginx para o TechWeek 2026 numa VM OCI única (frontend estático + backend PHP).
# Instalado automaticamente por setup.sh (que substitui __REPO_PATH__/__PHP_VERSION__).
# Layout: front em __REPO_PATH__/frontend/build, back em __REPO_PATH__/backend.
# URLs mantêm o prefixo /TW26/ usado pelo CRA (homepage) e pelos calls axios hardcoded.

server {
    listen 80;
    listen [::]:80;
    server_name techweekfb.com.br www.techweekfb.com.br _;

    root __REPO_PATH__;

    # Raiz do domínio redireciona para o prefixo usado pela SPA, preservando a
    # query string (os links dos e-mails são do tipo /?page=account)
    location = / {
        return 302 /TW26/$is_args$args;
    }

    # Página 404 da marca (mostra o endereço acessado e o endereço correto)
    error_page 404 /__404.html;
    location = /__404.html {
        internal;
        alias __REPO_PATH__/deploy/oci/errors/404.html;
    }

    # /TW26 sem a barra final -> /TW26/ (o prefixo /TW26/ casa só com a barra)
    location = /TW26 {
        return 301 /TW26/$is_args$args;
    }

    # Bloqueia dotfiles (.env etc.) em qualquer lugar
    location ~ /\. {
        deny all;
    }

    # Extensões sensíveis em qualquer lugar do site (defesa em profundidade)
    location ~* \.(env|sql|sh|bak|old|orig|swp|log|lock|ini|yml|yaml|map|md|jsx|ts|tsx)$ {
        deny all;
    }

    # storage/ (comprovantes de pagamento e QR codes) fica na raiz do repo, que é
    # o `root` deste site — sem esta regra o nginx serviria os arquivos por URL
    # direta. Só os endpoints PHP autenticados podem ler essa pasta.
    location ^~ /storage/ {
        deny all;
    }

    # Backend PHP: SÓ api/ executa. bin/ (scripts CLI), config/, vendor/ e
    # database/ nunca são alcançáveis por URL (nem executados, nem baixados).
    # (location regex isolada, sem aninhamento, para evitar que o rewrite de
    # uma location prefixo externa deixe de ser aplicado às requisições .php)
    location ~ ^/TW26/backend/(?<backend_path>api/.+\.php)(?<path_info>/.+)?$ {
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME __REPO_PATH__/backend/$backend_path;
        fastcgi_param PATH_INFO $path_info;
        include fastcgi_params;
    }

    # Qualquer OUTRO .php (fora de api/) nunca executa nem é baixado como texto.
    # Fica depois da regra de api/ porque o nginx usa a primeira regex que casa.
    location ~* \.(php[0-9]?|phtml|phar|inc)(/|$) {
        return 404;
    }

    # Todo o resto de /TW26/backend/ (migrations .sql, schema, composer.*,
    # vendor/, bin/, config/, assets/) responde 404. Não há estático a servir.
    location /TW26/backend/ {
        return 404;
    }

    # Frontend estático (build do CRA, homepage "/TW26")
    location /TW26/ {
        alias __REPO_PATH__/frontend/build/;
        try_files $uri $uri/ /TW26/index.html;
    }

    # Qualquer outro caminho sem o prefixo (ex.: /?page=x, /hackathon) é
    # normalizado para /TW26/..., preservando caminho e query string.
    # Locations mais específicas acima (storage, dotfiles, /TW26/...) têm prioridade.
    location / {
        return 302 /TW26$request_uri;
    }

    client_max_body_size 10m;
}
