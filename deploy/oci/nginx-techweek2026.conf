# Site nginx para o TechWeek 2026 numa VM OCI única (frontend estático + backend PHP).
# Instalado automaticamente por setup.sh (que substitui __REPO_PATH__/__PHP_VERSION__).
# Layout: front em __REPO_PATH__/frontend/build, back em __REPO_PATH__/backend.
# URLs mantêm o prefixo /TW26/ usado pelo CRA (homepage) e pelos calls axios hardcoded.

server {
    listen 80;
    listen [::]:80;
    server_name techweekfb.com.br www.techweekfb.com.br _;

    root __REPO_PATH__;

    # Raiz do domínio redireciona para o prefixo usado pela SPA, preservando a
    # query string (os links dos e-mails são do tipo /?page=account)
    location = / {
        return 302 /TW26/$is_args$args;
    }

    # Bloqueia dotfiles (.env etc.) em qualquer lugar
    location ~ /\. {
        deny all;
    }

    # storage/ (comprovantes de pagamento e QR codes) fica na raiz do repo, que é
    # o `root` deste site — sem esta regra o nginx serviria os arquivos por URL
    # direta. Só os endpoints PHP autenticados podem ler essa pasta.
    location ^~ /storage/ {
        deny all;
    }

    # Backend PHP: casa direto o script .php e passa pro PHP-FPM.
    # (location regex isolada, sem aninhamento, para evitar que o rewrite de
    # uma location prefixo externa deixe de ser aplicado às requisições .php)
    location ~ ^/TW26/backend/(?<backend_path>.+\.php)(?<path_info>/.+)?$ {
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME __REPO_PATH__/backend/$backend_path;
        fastcgi_param PATH_INFO $path_info;
        include fastcgi_params;
    }

    # Demais arquivos estáticos eventuais sob /TW26/backend/ (raro em produção)
    location /TW26/backend/ {
        alias __REPO_PATH__/backend/;
        try_files $uri =404;
    }

    # Frontend estático (build do CRA, homepage "/TW26")
    location /TW26/ {
        alias __REPO_PATH__/frontend/build/;
        try_files $uri $uri/ /TW26/index.html;
    }

    client_max_body_size 10m;
}
